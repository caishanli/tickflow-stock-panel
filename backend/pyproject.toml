[project]
name = "tickflow-stock-panel-backend"
version = "0.1.83"
description = "A 股选股 + 监控 + 回测面板 — TickFlow 适配"
readme = "README.md"  # 仓库根 README 的 symlink（backend/README.md）
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    # Data
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "baostock>=0.9",              # 全市场 5min/日线/复权因子回源 (backfill_baostock_3y)
    "akshare>=1.18,<2",           # ETF 单位净值回源 (etf_nav_service)
    # stockdata 服务由主后端 guardian 用 sys.executable 直接 spawn，是常驻进程，
    # 其回源实现（mootdx_service/mootdx_src/rt_sources）的依赖必须在基础依赖里：
    # 放 extras 时 uv sync 默认不装，venv 重建即复现 ModuleNotFoundError
    # （08-11 pytdx、08-29 mootdx 两次事故同因）。
    "mootdx>=0.11.7",             # stockdata 回源 (mootdx_service)
    "pytdx>=1.72",                # mootdx_src 用 pytdx 替换 mootdx 内置 tdxpy（mootdx 只声明 tdxpy）
    "requests>=2.31",             # stockdata rt_sources/sources 直接 import
    "pandas>=2.2",                # 仅在 BacktestService 边界使用,见 §7.4 / ADR-19
    "psutil>=5.9",                # 独立回测 worker 的峰值 RSS 与退出后内存指标
    # llvmlite 不再提供 macOS Intel wheel；该平台使用 Matrix 纯 Python fallback。
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastexcel>=0.10",            # Polars 读取 xlsx/xls
    # TickFlow 官方 SDK
    "tickflow[all]>=0.1.23",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # AI(可选,但默认装上)
    "openai>=1.40",               # OpenAI 兼容适配器复用 openai SDK
    "httpx>=0.27",
    "platformdirs>=4.0",          # 桌面版用户数据目录 (跨平台持久可写)
    "winotify>=1.1; sys_platform == 'win32'",  # Windows 系统通知 (进操作中心)
    "plyer>=2.1",                 # 系统通知跨平台兜底 (macOS/Linux)
    # Watchlist screenshot OCR (Tesseract)
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
# Legacy CPU runtime: install the Polars compatibility kernel on
# machines without AVX2/FMA support.
# Enable with: uv sync --extra legacy-cpu
legacy-cpu = [
    "polars[rtcompat]>=1.0",
]

# vectorbt 还会引入绘图、交互组件等完整分析栈，仍保持为可选 extras。
# Matrix 引擎只直接依赖上面的 numba/llvmlite 编译内核。
# 启用:`uv sync --extra backtest`
backtest = [
    "vectorbt>=0.26",
]

# 桌面客户端依赖: pywebview 桌面窗口。打包用 (PyInstaller), 生产/Docker 不需要。
# 启用:`uv sync --extra desktop`
desktop = [
    "pywebview>=5.0",
]

# 量化回测/模拟盘依赖 (RQAlpha)。启用: uv sync --extra quant
# （mootdx/pytdx/requests 已提为基础依赖——stockdata 服务常驻进程必需，见 dependencies 注释）
quant = [
    "rqalpha>=0.26",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # 长行交给 fmt
    # 中文 docstring/注释含全角标点是仓库风格（曾按文件逐个 per-file-ignore，
    # 新文件打地鼠式漏配——08-29 起全局忽略）。
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# RUF100：禁用规则 BLE001 的死 noqa（BLE 不在 select 里，行内 noqa 变未使用）。
"app/services/baostock_backfill.py" = ["RUF100"]
"scripts/backfill_baostock_3y.py" = ["RUF100"]
"tests/quant/test_baostock_backfill.py" = ["RUF100"]
"app/quant/ptradecompat.py" = ["RUF100"]
"app/quant/ptradeengine/*" = ["RUF100"]
"tests/quant/test_ptrade_strategy_file.py" = ["RUF100"]
"tests/quant/test_ptradecompat.py" = ["RUF100"]
"tests/quant/test_ptrade_70978ed5_engine.py" = ["RUF100"]
"tests/quant/test_ptrade_70978ed5_file.py" = ["RUF100"]
"tests/quant/test_ptrade_70978ed5_register.py" = ["RUF100"]
"tests/quant/test_ptradeengine.py" = ["RUF100"]
"tests/quant/test_ptrade_vs_jq_alignment.py" = ["RUF100"]
"tests/quant/test_70978ed5_ptrade_alignment.py" = ["RUF100"]
"app/services/stockdata/sources.py" = ["RUF100"]
"app/services/stockdata/scheduler.py" = ["RUF100"]
"app/services/stockdata/rt_sources.py" = ["RUF100"]
"app/services/stockdata_guardian.py" = ["RUF100"]
"scripts/run_stockdata_service.py" = ["RUF100"]
"tests/quant/test_mootdx_backfill_coverage.py" = ["RUF100"]
"app/quant/simulate/memory.py" = ["RUF100"]
"tests/quant/test_sim_memory.py" = ["RUF100"]
"app/quant/jqengine/datasource/mootdx_src.py" = ["RUF100"]
"tests/quant/test_mootdx_paging.py" = ["RUF100"]
"tests/quant/test_startup_backfill_guard.py" = ["RUF100"]
"app/services/stockdata/backfill_pool.py" = ["RUF100"]
"tests/quant/test_backfill_pool.py" = ["RUF100"]
"tests/quant/test_stockdata_rt_sources.py" = ["RUF100"]
"tests/quant/test_stockdata_sources.py" = ["RUF100"]

# mootdx==0.11.7 硬锁 httpx<0.26，与基础依赖 httpx>=0.27 冲突。
# 用 override 强制 httpx>=0.27（mootdx 仅作多源降级备用，内部 httpx 用法兼容）。
[tool.uv]
override-dependencies = ["httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: 集成测试，需真实 data/ 分区与 stock data 服务（默认跳过，显式 -m integration 运行）",
]

[tool.mypy]
# baostock 官方无类型标注、pandas 未引入 pandas-stubs：按 Any 处理（import-untyped）

[[tool.mypy.overrides]]
module = ["baostock", "pandas"]
ignore_missing_imports = true
